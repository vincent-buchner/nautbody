[project]
name = "alexa-clone-for-dummies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper",
  "groq",
  "numpy",
  "onnxruntime",
  "pillow",
  "python-dotenv",
  "sounddevice",
  "transformers",
  "torch",
  "silero-vad>=6.2.1",
  "setuptools<81",
  "resemble-perth>=1.0.1",
  "pyaudio>=0.2.14",
  "pydantic>=2.13.4",
  "ml-dtypes>=0.5",
  "chatterbox-tts",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
venvPath = "/workspace"
venv = ".venv"

[tool.uv.sources]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "ANN"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["infrastructure", "application"]

[tool.ruff.lint.pep8-naming]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
